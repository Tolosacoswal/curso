<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constantes</title>
</head>
<body>
    <script>
        //si usamos la variable const el valor que asignamos no podrá cambiar
        const precio = 100;
        
        document.write('precio: ', precio);
        document.write('<br>');
        precio2 = 500;
        //document.write('precio: ', precio);
        //aquí con este ejemplo vemos que la variable const no se puede modificar ya que su valor ya esta establecido
        precio2 = 500;
        document.write('Nuevo precio: ', precio2);
        //en este caso debemos generar un nuevo valor precio2 y este se mostrara ya que se esta ingresando un nuevo valor 
    </script>
</body>
</html>
