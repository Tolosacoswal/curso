<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concatenar</title>
</head>
<body>
    <script>
        //ejemplo 1 concatenar
        let nombre = 'Edgard';
        let apellido = 'Alzate';
        let precio = 20000;
        document.write (nombre +' '+ apellido);
        document.write('<br>')
        document.write ('nombre: '+ nombre + ' ' + apellido);
        document.write ('<br>')
        let saludo = nombre.concat(apellido);
        document.write(saludo);
        document.write ('<br>');
        document.write ('el precio es: ' + precio);
        document.write ('<br>');
        document.write ('==============<br>');
        //ejemplo conacatenar con comas

        document.write (nombre, ' ' ,apellido);
        document.write ('<br>');
        document.write ('el precio es: ', precio);


    </script>
</body>
</html>
